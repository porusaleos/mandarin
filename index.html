<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#C4301A">
<title>Wǒ Hànyǔ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EFE8;--sf:#FAF9F4;--ink:#15130E;--mu:#6A665B;--ln:#15130E26;--sl:#C4301A;--sl-bg:#FBECE9;--ok-bg:#EBF5F0;--ok-border:#1C7A62;--bad-bg:#FDECEA;--bad-border:#C4372C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0D0A;--sf:#171610;--ink:#EDE9DE;--mu:#9B968A;--ln:#EDE9DE2E;--sl:#FF6B4B;--sl-bg:#301B17;--ok-bg:#162A24;--ok-border:#2F9C7F;--bad-bg:#3A1B18;--bad-border:#FF7262}}
:root[data-theme="dark"]{--bg:#0E0D0A;--sf:#171610;--ink:#EDE9DE;--mu:#9B968A;--ln:#EDE9DE2E;--sl:#FF6B4B;--sl-bg:#301B17;--ok-bg:#162A24;--ok-border:#2F9C7F;--bad-bg:#3A1B18;--bad-border:#FF7262}
:root[data-theme="light"]{--bg:#F1EFE8;--sf:#FAF9F4;--ink:#15130E;--mu:#6A665B;--ln:#15130E26;--sl:#C4301A;--sl-bg:#FBECE9;--ok-bg:#EBF5F0;--ok-border:#1C7A62;--bad-bg:#FDECEA;--bad-border:#C4372C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Instrument Sans',system-ui,sans-serif}
main{max-width:740px;margin:0 auto;padding:16px;padding-bottom:110px}
h1{margin:0;font-size:.95rem;text-transform:uppercase;letter-spacing:.16em;font-weight:700}
h2{margin:.2rem 0;font-family:'Noto Serif SC','Songti SC',serif}
h3{margin:0 0 .5rem;font-family:'Noto Serif SC','Songti SC',serif}
p{margin:.3rem 0}
.mu,small{color:var(--mu)}
header{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.seal{background:var(--sl);color:#fff;width:34px;height:34px;border-radius:2px;display:grid;place-items:center;font-size:1.25rem;font-family:'Noto Serif SC',serif;cursor:pointer}
#nav,#lv{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
.tb,.chip,.btn,.ic{border:1px solid var(--ink);background:var(--sf);border-radius:2px;padding:7px 14px;white-space:nowrap;box-shadow:none;transition:transform .12s,background .12s}
.tb.on{color:var(--ink);background:none;box-shadow:inset 0 3px 0 var(--sl);font-weight:700}
.chip{padding:4px 12px;font-size:.85rem}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border-radius:2px;font-weight:500}.btn:active{transform:translateY(1px)}
.ic{border-radius:2px;padding:4px 9px}
button:focus-visible,input:focus-visible{outline:2px solid var(--sl);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-top:3px solid var(--ink);border-radius:2px;padding:16px;margin:12px 0}
.zh{font-family:'Noto Serif SC','Songti SC','SimSun',serif}
.hero{background:var(--ink);color:var(--bg);display:flex;gap:20px;align-items:center;border-radius:2px;border-top:3px solid var(--sl);border-left:0;border-right:0;border-bottom:0}
.hero .mu{color:var(--bg);opacity:.75}.hero .zh{font-size:5.2rem;line-height:1;font-weight:900}.hero .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats .card{text-align:center;margin:0}.stats b{font-size:1.7rem;display:block;font-family:'Noto Serif SC',serif}
.row{display:grid;grid-template-columns:70px 1fr 60px;gap:10px;align-items:center;margin:6px 0}
.bar{height:6px;background:var(--ln);border-radius:0;overflow:hidden}.bar i{display:block;height:100%;background:var(--sl)}
.ok{background:var(--ok-bg)!important;border-color:var(--ok-border)!important}
.bad{background:var(--bad-bg)!important;border-color:var(--bad-border)!important}
.fo{color:var(--ok-border);font-weight:700}.fx{color:var(--bad-border);font-weight:700}
.ctr{text-align:center}.big{font-size:4rem;line-height:1.2;font-family:'Noto Serif SC',serif}.big2{font-size:1.8rem;font-weight:700}.big3{font-size:1.25rem}
.fc{min-height:240px;display:grid;align-content:center;text-align:center;cursor:pointer}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.opts,.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.opt{padding:12px;text-align:center;width:100%}.two .btn{margin-bottom:8px}
.sel{outline:3px solid var(--sl)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.mode{text-align:left;display:block;margin:0;cursor:pointer}.mode b,.mode span{display:block}.mode span{color:var(--mu);font-size:.9rem}
.inp{width:100%;font:inherit;padding:11px;border:1px solid var(--ink);border-radius:2px;background:var(--sf);color:var(--ink);margin:8px 0}
.tray{min-height:60px;border:1px dashed var(--ink);border-radius:2px;padding:8px;margin:8px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.vr{display:grid;grid-template-columns:72px 1fr auto auto;gap:10px;align-items:center;padding:10px 14px;margin:6px 0}.vh{font-size:1.8rem;font-family:'Noto Serif SC',serif}
.py,.py2{color:var(--sl);font-weight:700;font-size:1.4rem;margin:.1rem 0}
.chip.big3{border-radius:2px;padding:6px 12px;text-align:center;line-height:1.3}.chip.big3 small{font-family:'Instrument Sans',sans-serif;color:var(--mu)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bg);border-top:2px solid var(--ink);justify-content:space-around;gap:0;padding:0 4px calc(2px + env(safe-area-inset-bottom,0px))}
#nav .tb{flex:1;border:0;border-radius:0;font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;padding:12px 2px 10px;color:var(--mu);background:none;box-shadow:none}
#nav .tb.on{color:var(--ink);background:none;box-shadow:inset 0 3px 0 var(--sl);font-weight:700}
.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink);width:100%;padding:13px;font-weight:700;margin-top:10px}
.unit{border-radius:0;background:var(--ink)!important;color:var(--bg);border-left:6px solid var(--sl);padding:12px 16px;margin-top:16px}.unit h3{margin:0;color:var(--bg)}.unit small{color:var(--bg);opacity:.75}
.nodes{display:flex;flex-direction:column;align-items:center;gap:14px;margin:16px 0 8px}
.node{width:84px;height:84px;border-radius:2px;background:var(--sf);color:var(--ink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-family:'Noto Serif SC',serif}
.node .zh{font-size:1.8rem}.node small{color:inherit;opacity:.85;font-size:.72rem;font-family:'Instrument Sans',sans-serif}
.node.dn{background:var(--sl);color:#fff}.node.lk{background:transparent;border:2px dashed var(--ln);box-shadow:none;color:var(--mu)}
.node:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.lh{display:flex;gap:12px;align-items:center;margin-bottom:10px}.lh .bar{flex:1;height:8px}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.mc{min-height:80px;border-radius:2px;border:1px solid var(--ln);background:var(--sf);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;font-size:.85rem;line-height:1.2}
.bub{background:var(--sf);border:1px solid var(--ln);border-radius:2px;padding:10px 14px;margin:8px 36px 8px 0;cursor:pointer}.bub.r{border-radius:2px;margin:8px 0 8px 36px;background:var(--sl-bg)}
.dopts{display:grid;gap:8px;margin:10px 0}
#app.an>*{animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes xp{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.fo{animation:pop .35s}.fx{animation:shake .35s}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}.cf i{position:absolute;top:-30px;font-style:normal;font-size:1.7rem;animation:fall linear forwards;font-family:'Noto Serif SC',serif;color:var(--sl);font-weight:900}
.xp{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border:1px solid var(--sl);font-weight:700;padding:6px 14px;border-radius:2px;z-index:30;pointer-events:none;animation:xp 1.1s ease-out forwards}
.blk{border:1px solid var(--ink);border-bottom-width:3px;touch-action:manipulation;transition:transform .1s}.blk:active{transform:scale(.95)}
.slot{display:inline-block;vertical-align:top;border-radius:2px;background:var(--sl-bg)}
#ta .blk{background:var(--sl-bg);border-color:var(--sl)}#ta:empty::before{content:'Ketuk kata di bawah untuk menyusun kalimat';color:var(--mu);font:.9rem 'Instrument Sans',sans-serif;align-self:center}
.chat{margin:8px 0}.msg{display:flex;gap:8px;align-items:flex-end;margin:8px 0}.msg.me{flex-direction:row-reverse}
.av{width:36px;height:36px;border-radius:2px;background:var(--ink);color:var(--bg);font-weight:700;font-size:.95rem;display:grid;place-items:center;flex:none}
.msg .bub{margin:0;max-width:82%}.msg.nw{animation:pop .35s}.chatopts{animation:up .35s .3s both}
#back{font-size:1.2rem;padding:4px 10px}.vr2{display:grid;grid-template-columns:72px 1fr auto auto auto;gap:8px;align-items:center}
.exm{background:var(--sl-bg);border-radius:2px;padding:8px 10px;margin-top:8px;cursor:pointer}
@media(max-width:540px){.hero{flex-direction:column;text-align:center}.opts{grid-template-columns:1fr}.mg{grid-template-columns:repeat(3,1fr)}}
.fm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}.fm b{background:var(--sl-bg);color:var(--sl);border-radius:2px;padding:2px 8px}
.ex{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}.tg{font-size:.75rem;background:var(--ink);color:var(--bg);border-radius:2px;padding:1px 8px;white-space:nowrap;height:fit-content}
.fc2{display:inline-flex;flex-direction:column;align-items:center;background:var(--sl-bg);border-radius:2px;padding:3px 8px;line-height:1.25;text-align:center}.fc2 .zh{color:var(--sl);font-weight:700}.fc2 small{font-size:.72rem}
.gh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.tw{display:flex;flex-wrap:wrap;gap:4px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.sg b{display:block;font-size:1.5rem;font-family:'Noto Serif SC',serif}.sg small{display:block;line-height:1.2}
.hist{display:flex;align-items:flex-end;gap:4px;height:70px;background:var(--sf);border:1px solid var(--ln);padding:4px}.hist i{flex:1;background:var(--ink);min-height:3px}.hist i:last-child{background:var(--sl)}
.due{display:flex;justify-content:space-between;align-items:center;gap:12px}.due .btn.go{width:auto;margin:0;flex:none}
.fl{display:block;margin:12px 0 0;font-size:.82rem;color:var(--mu)}.fl.row{display:flex;gap:8px;align-items:center;margin:12px 0}.fl .inp{margin:4px 0 0;font-size:1rem;color:var(--ink)}
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:max(24px,env(safe-area-inset-top)) 16px 32px}
.authbox{max-width:440px;margin:4vh auto 0;background:var(--sf);border:1px solid var(--ln);border-top:4px solid var(--ink);padding:24px}
.authbox h2{font-size:1.8rem;margin:.5rem 0 .2rem}
.rk{font:600 1.25rem/1.5 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;border:2px solid var(--ink);padding:14px;margin:14px 0;background:var(--sf);word-break:break-all;user-select:all}
.lnk{display:flex;justify-content:space-between;margin-top:16px;font-size:.9rem;flex-wrap:wrap;gap:8px}.lnk a{color:var(--ink);font-weight:600}
.pmt{height:5px;background:var(--ln);margin:8px 0 4px}.pmt i{display:block;height:100%;background:var(--sl);transition:width .2s}
.sandhi-box{background:var(--sl-bg);border-left:4px solid var(--sl);padding:10px 12px;margin:10px 0;font-size:.9rem}

/* ===== FORM & AUTH V2 STYLES ===== */
.auth-tabs{display:flex;border-bottom:2px solid var(--ink);margin-bottom:16px}
.auth-tab{flex:1;background:none;border:none;border-bottom:3px solid transparent;padding:10px 4px;font-size:.9rem;font-weight:700;color:var(--mu);cursor:pointer;text-align:center;text-transform:uppercase;letter-spacing:.05em;transition:all .15s}
.auth-tab.active{color:var(--ink);border-bottom-color:var(--sl)}
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap .inp{padding-right:42px;margin:4px 0 0}
.eye-btn{position:absolute;right:8px;top:calc(50% + 2px);transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--mu);padding:4px 6px;font-size:1.15rem;line-height:1}
.eye-btn:hover{color:var(--ink)}
.sec-select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--ink);border-radius:2px;background:var(--sf);color:var(--ink);margin:4px 0 0}
.auth-alert{padding:10px 12px;border-radius:2px;margin:12px 0;font-size:.88rem;line-height:1.4;display:none}
.auth-alert.show{display:block}
.auth-alert.error{background:var(--bad-bg);border:1px solid var(--bad-border);color:var(--bad-border)}
.auth-alert.success{background:var(--ok-bg);border:1px solid var(--ok-border);color:var(--ok-border)}
.divider-text{display:flex;align-items:center;text-align:center;margin:16px 0;color:var(--mu);font-size:.82rem}
.divider-text::before,.divider-text::after{content:'';flex:1;border-bottom:1px solid var(--ln)}
.divider-text:not(:empty)::before{margin-right:.75em}
.divider-text:not(:empty)::after{margin-left:.75em}
.badge-pill{display:inline-block;padding:2px 8px;border-radius:2px;background:var(--ok-bg);border:1px solid var(--ok-border);color:var(--ok-border);font-size:.75rem;font-weight:600}
.auth-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:grid;place-items:center;padding:16px}
.auth-modal-box{background:var(--sf);border:1px solid var(--ln);border-top:4px solid var(--ink);padding:24px;max-width:440px;width:100%}


/* ===== DIALOG CARD GRID STYLES ===== */
.dlg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin:16px 0}
.dlg-card{background:var(--sf);border:1px solid var(--ln);border-top:4px solid var(--ink);border-radius:4px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;box-shadow:0 2px 5px rgba(0,0,0,.04);position:relative}
.dlg-card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.09);border-color:var(--sl)}
.dlg-card:active{transform:translateY(0)}
.dlg-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dlg-title{font-size:1.15rem;font-weight:700;margin:0 0 6px 0;color:var(--ink);font-family:'Instrument Sans',sans-serif}
.dlg-preview{background:var(--sl-bg);border-radius:2px;padding:8px 10px;margin:8px 0 12px;font-size:.88rem;line-height:1.35;border-left:3px solid var(--sl)}
.dlg-preview .zh{font-size:1rem;font-weight:600;display:block;margin-bottom:2px}
.dlg-preview .py2{font-size:.85rem;font-weight:600}
.dlg-card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid var(--ln)}
.dlg-btn{font-size:.84rem;font-weight:700;color:var(--sl);display:flex;align-items:center;gap:4px}
.tg-hsk1{background:#1c7a62;color:#fff}
.tg-hsk2{background:#2b6fb0;color:#fff}
.tg-hsk3{background:#7c3aed;color:#fff}
.tg-hsk4{background:#c4301a;color:#fff}


/* ===== MOBILE BOTTOM NAVBAR & DRAWER SHEET ===== */
#nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 25;
  background: var(--bg);
  border-top: 2px solid var(--ink);
  display: flex;
  justify-content: space-around;
  align-items: stretch;
  padding: 0 4px calc(2px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -2px 10px rgba(0,0,0,.04);
}
#nav .tb {
  flex: 1;
  border: 0;
  border-radius: 0;
  background: none;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 7px 2px 5px;
  color: var(--mu);
  font-size: .72rem;
  font-weight: 600;
  letter-spacing: .03em;
  gap: 2px;
  cursor: pointer;
  transition: color .12s, transform .1s;
  min-height: 52px;
}
#nav .tb .nav-ic {
  font-size: 1.25rem;
  line-height: 1;
  display: block;
}
#nav .tb.on {
  color: var(--ink);
  font-weight: 700;
  box-shadow: inset 0 3px 0 var(--sl);
  background: none;
}
#nav .tb.on .nav-ic {
  transform: scale(1.12);
}
#nav .tb:active {
  transform: scale(.95);
}

/* Bottom Sheet Modal */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 30;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s ease;
  backdrop-filter: blur(2px);
}
.sheet-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}
.sheet-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 35;
  background: var(--sf);
  border-top: 3px solid var(--ink);
  border-radius: 8px 8px 0 0;
  padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%);
  transition: transform .26s cubic-bezier(.2, .9, .3, 1);
  box-shadow: 0 -8px 24px rgba(0,0,0,.15);
  max-width: 640px;
  margin: 0 auto;
}
.sheet-drawer.open {
  transform: translateY(0);
}
.sheet-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--ln);
}
.sheet-title {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}
.sheet-close {
  background: none;
  border: 1px solid var(--ln);
  border-radius: 2px;
  padding: 4px 9px;
  font-size: .95rem;
  cursor: pointer;
  color: var(--mu);
}
.sheet-close:hover {
  color: var(--ink);
  border-color: var(--ink);
}
.sheet-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
@media (max-width: 380px) {
  .sheet-grid {
    grid-template-columns: 1fr;
  }
}
.sheet-item {
  background: var(--bg);
  border: 1px solid var(--ln);
  border-left: 3px solid var(--ink);
  border-radius: 2px;
  padding: 10px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  cursor: pointer;
  transition: transform .12s, border-color .12s, background .12s;
}
.sheet-item:hover, .sheet-item:active {
  background: var(--sf);
  border-left-color: var(--sl);
  transform: translateY(-2px);
}
.sheet-item.on {
  border-left-color: var(--sl);
  background: var(--sl-bg);
}
.sheet-item .s-ic {
  font-size: 1.35rem;
  flex: none;
}
.sheet-item b {
  display: block;
  font-size: .86rem;
  line-height: 1.2;
  color: var(--ink);
}
.sheet-item small {
  display: block;
  font-size: .72rem;
  color: var(--mu);
  margin-top: 2px;
}


/* ===== GUIDE CARDS GRID STYLES (TATA BAHASA & PANDUAN) ===== */
.guide-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin: 14px 0 24px;
}
@media (min-width: 600px) {
  .guide-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}
.guide-card {
  background: var(--sf);
  border: 1px solid var(--ln);
  border-top: 3px solid var(--ink);
  border-radius: 4px;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: left;
  cursor: pointer;

}

const D=[['h','m','Apa arti kata ini?'],['m','h','Pilih hanzi untuk arti ini:'],['h','p','Pilih pinyin yang tepat:'],['p','m','Apa arti pinyin ini?']];
const mq=()=>{const w=sh(pool())[0];return{w,d:D[R(4)],o:sh([w,...sh(pool().filter(x=>x!=w)).slice(0,3)])}},rk=x=>x<50?'Pemula':x<200?'Pelajar':x<500?'Mahir':x<1000?'Suhu':'Master';

function start(k){

const f=S.filter(s=>st.lv.includes(s.v));
cur={k,sc:0,i:0,r:0,cb:0,q:[],t:60,run:()=>({quiz:qz,ear:qz,blitz:qz,match:mt,type:ty,dikte:ty,ord:od,fill:fq,mem:me})[k]()};
if(k=='blitz'){const c=cur,t=setInterval(()=>{if(cur!==c)return clearInterval(t);c.t--;const e=$('#tm');if(e)e.textContent=''+c.t+' dtk';if(c.t<=0){clearInterval(t);c.over=1;fin(c.sc,c.i)}},1000)}
if(k=='quiz'||k=='ear')cur.q=sh(pool()).slice(0,st.n).map(w=>({w,d:k=='ear'?['h','m','Dengarkan, lalu pilih artinya:']:D[R(4)],o:sh([w,...sh(pool().filter(x=>x!=w)).slice(0,3)])}));
if(k=='type'||k=='dikte')cur.q=sh(pool()).slice(0,st.n);
const sp=sh(f.length>=st.n?f:S).slice(0,st.n);
if(k=='ord')cur.q=sp;

}

function fin(sc,n){

gain(sc*3);if(sc>=n*.8)conf();

}

function qz(){
const c=cur;if(c.k=='lesson'&&c.h<1)return lf();
if(c.k=='blitz'){if(c.over)return fin(c.sc,c.i);if(!c.q[c.i])c.q.push(mq())}
if(c.i>=c.q.length)return fin(c.sc,c.q.length);
const{w,d,o}=c.q[c.i];
app.innerHTML=`${c.k=='blitz'?`<p class="mu"><span id="tm">${c.t} dtk</span> kombo x${c.cb}, skor ${c.sc}</p>`:c.k=='lesson'?hd(c):`<p class="mu">Soal ${c.i+1} dari ${c.q.length}</p>`}<section class="card ctr"><p>${d[2]}</p>${c.k=='ear'||d[3]?`<button class="btn" onclick="say('${w.h}')"><i class="gi gi-spk"></i>Putar Audio</button>`:`<div class="${d[0]=='h'?'zh big':'big2'}" onclick="say('${w.h}')">${w[d[0]]}</div>${d[0]=='h'&&d[1]!='p'?`<h2 class="py">${w.p}</h2>`:''}`}</section><div class="opts">${o.map((x,j)=>`<button class="btn opt ${d[1]=='h'?'zh':''}" onclick="ans(${j})">${d[1]=='h'?`<span class="big3">${x.h}</span><br><small>${x.p}</small>`:x[d[1]]}</button>`).join('')}</div><div id="fb"></div>`;
if(c.k=='ear'||d[3]||d[0]=='h')say(w.h)
}

function ans(j){
const c=cur,{w,d,o}=c.q[c.i],ok=o[j]==w;
mk(w,ok);c.cb=ok?(c.cb||0)+1:0;
if(ok){c.sc++;if(c.cb>2)gain(c.cb>5?2:1)}
say(o[j].h);
if(c.k=='lesson'&&!ok){c.h--;c.q.push(c.q[c.i])}
document.querySelectorAll('.opt').forEach((b,x)=>{b.disabled=1;if(o[x]==w)b.classList.add('ok');else if(x==j)b.classList.add('bad')});
$('#fb').innerHTML=`<p class="${ok?'fo':'fx'}">${ok?'✓ Tepat!'+(c.cb>2?' Kombo x'+c.cb:''):'✗ Kurang tepat'}</p><p class="mu"><span class="zh">${w.h}</span> [${w.p}]: ${w.m}</p><button class="btn go" onclick="cur.i++;cur.run()">Lanjut</button>`;

}

function mt(){

app.innerHTML=`<p class="mu">Soal ${c.i+1} dari ${c.q.length}</p><section class="card ctr">${c.k=='dikte'?`<div class="big" onclick="say('${w.h}')">听</div><p class="mu">Dengarkan audio, lalu tulis pinyin-nya</p>`:`<div class="zh big">${w.h}</div><p>${w.m}</p>`}<button class="btn" onclick="say('${w.h}')"><i class="gi gi-spk"></i>Putar Audio</button></section><input id="inp" class="inp" placeholder="Ketik pinyin (nada boleh tanpa tanda, mis: ni hao)" autocomplete="off" autocapitalize="off" aria-label="Jawaban pinyin"><div class="acts"><button class="btn go" onclick="ck()">Periksa</button><button class="btn" onclick="$('#fb').innerHTML='<p class=mu>Petunjuk: huruf awal '+nt(cur.q[cur.i].p)[0]+', panjang '+nt(cur.q[cur.i].p).length+' huruf</p>'">Petunjuk</button></div><div id="fb"></div>`;
$('#inp').onkeydown=e=>{if(e.key=='Enter')ck()};$('#inp').focus();say(w.h)
}
function ck(){
const c=cur;if(c.chk)return;c.chk=1;const w=c.q[c.i],v=$('#inp').value.replace(/v/gi,'ü'),z=s=>s.replace(/\s/g,'').toLowerCase(),ex=z(v)==z(w.p),ok=ex||nt(v)==nt(w.p);

$('#fb').innerHTML=`<p class="${ok?'fo':'fx'}">${ex?'✓ Sempurna!':ok?'✓ Benar (nada belum sesuai)':'✗ Belum tepat'}</p><p>Jawaban: <b>${w.p}</b> <span class="zh">${w.h}</span> (${w.m})</p><button class="btn go" onclick="cur.i++;cur.run()">Lanjut</button>`

/* Susun Kalimat (od) dengan animasi transisi yang mulus */
function od(){
const c=cur;if(c.i>=c.q.length)return fin(c.sc,c.q.length);
const s=c.q[c.i],py=s.p.split(' '),b=sh(s.t.split(' ').map((x,i)=>({x,i,p:py[i]||''})));c.chk=0;
app.innerHTML=`<p class="mu">Soal ${c.i+1} dari ${c.q.length}</p><section class="card ctr"><p class="big3">${s.m}</p></section><div class="tray zh" id="ta"></div><div class="tray zh" id="tb">${b.map(o=>`<span class="slot" data-i="${o.i}"><button class="chip big3 blk" data-i="${o.i}"><span class="zh">${o.x}</span><br><small>${o.p}</small></button></span>`).join('')}</div><button class="btn go" onclick="cko()">Periksa</button><div id="fb"></div>`;
document.querySelectorAll('.slot').forEach(l=>{const k=l.firstChild;l.style.width=k.offsetWidth+'px';l.style.height=k.offsetHeight+'px'});
document.querySelectorAll('.blk').forEach(e=>e.onclick=()=>bk(e))
}
function bk(e){
if(cur.chk)return;say(e.querySelector('.zh').textContent);
const ta=$('#ta'),all=[...document.querySelectorAll('.blk')],was=new Map(all.map(x=>[x,x.getBoundingClientRect()]));
if(e.parentNode==ta)$('.slot[data-i="'+e.dataset.i+'"]').appendChild(e);else ta.appendChild(e);
all.forEach(x=>{const a=was.get(x),n=x.getBoundingClientRect(),dx=a.left-n.left,dy=a.top-n.top;if(dx||dy)x.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:260,easing:'cubic-bezier(.2,.8,.3,1)'})})
}
function cko(){

Jika dua suku kata bernada ke-3 berdampingan, suku kata pertama berubah menjadi nada ke-2.<br>
Contoh: <span class="zh">你好</span> ditulis <i>nǐ hǎo</i>, tetapi dibaca <b>ní hǎo</b>. <span class="zh">手表</span> ditulis <i>shǒubiǎo</i>, dibaca <b>shóubiǎo</b>.
<br><button class="btn" style="margin-top:6px;padding:3px 8px" onclick="say('你好')"><i class="gi gi-spk"></i>Dengar "nǐ hǎo"</button>
</div>
<div class="sandhi-box">
<b>2. Perubahan Nada "不" (bù)</b><br>
• Normalnya bernada ke-4 (bù).<br>
• Di depan kata bernada ke-4, berubah menjadi nada ke-2 (<b>bú</b>).<br>
Contoh: <span class="zh">不是</span> (bú shì), <span class="zh">不对</span> (bú duì). Di depan nada 1/2/3 tetap <i>bù</i>: <span class="zh">不吃</span> (bù chī).
<br><button class="btn" style="margin-top:6px;padding:3px 8px" onclick="say('不是')"><i class="gi gi-spk"></i>Dengar "bú shì"</button>
</div>
<div class="sandhi-box">
<b>3. Perubahan Nada "一" (yī)</b><br>
• Angka tunggal atau berurutan: nada ke-1 (yī), misal <i>yī, èr, sān</i>.<br>
• Di depan suku kata nada ke-4: berubah menjadi nada ke-2 (<b>yí</b>), misal <span class="zh">一下</span> (yíxià), <span class="zh">一共</span> (yígòng).<br>
• Di depan suku kata nada 1, 2, atau 3: berubah menjadi nada ke-4 (<b>yì</b>), misal <span class="zh">一天</span> (yì tiān), <span class="zh">一起</span> (yìqǐ).
<br><button class="btn" style="margin-top:6px;padding:3px 8px" onclick="say('一共 一起')"><i class="gi gi-spk"></i>Dengar "yígòng yìqǐ"</button>
</div>

/* ===== SISTEM KEAMANAN & AKUN (LOGIN, REGISTER, LUPA PASSWORD, AES-256) ===== */
const E=new TextEncoder(),Dc=new TextDecoder(),b6=a=>btoa(String.fromCharCode(...new Uint8Array(a))),u6=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),rnd=n=>crypto.getRandomValues(new Uint8Array(n)),IT=100000,AK='mdr.acc',FK='mdr.f';
const gA=()=>{try{return JSON.parse(localStorage.getItem(AK)||'{}')}catch(e){return{}}},pA=a=>localStorage.setItem(AK,JSON.stringify(a));
let K=null,UN='',idt;

const SEC_QUESTIONS = [
  'Apa nama hewan peliharaan pertama kamu?',
  'Di kota mana kamu dilahirkan?',
  'Apa nama sekolah dasar (SD) kamu?',
  'Apa makanan atau minuman favorit kamu?',
  'Siapa nama sahabat masa kecil kamu?'
];

async function dk(p,s,it){const m=await crypto.subtle.importKey('raw',E.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:s,iterations:it},m,{name:'AES-GCM',length:256},false,['wrapKey','unwrapKey'])}
async function wr(k,p,it){const s=rnd(16),iv=rnd(12),w=await crypto.subtle.wrapKey('raw',k,await dk(p,s,it),{name:'AES-GCM',iv});return{s:b6(s),i:b6(iv),w:b6(w)}}
async function uw(o,p,it){return crypto.subtle.unwrapKey('raw',u6(o.w),await dk(p,u6(o.s),it),{name:'AES-GCM',iv:u6(o.i)},{name:'AES-GCM',length:256},true,['encrypt','decrypt'])}

async function pst(){
  if(st.guest){try{localStorage.setItem('mdr',JSON.stringify(st))}catch(e){}return}
  if(!K||!UN)return;
  const iv=rnd(12),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:E.encode(UN)},K,E.encode(JSON.stringify(st))),a=gA();if(!a[UN])return;
  a[UN].iv=b6(iv);a[UN].ct=b6(ct);pA(a)
}

const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',nrk=()=>Array.from(rnd(20),b=>AL[b&31]).join('');

function findUser(query){
  const q=String(query||'').trim().toLowerCase();
  if(!q)return null;
  const a=gA();
  if(a[q])return{username:q,acc:a[q]};
  for(const u of Object.keys(a)){
    if(a[u].email&&a[u].email.toLowerCase()===q)return{username:u,acc:a[u]};
  }
  return null;
}

async function reg(u,email,p,sqIdx,sqAns){
  const a=gA();
  const rk=nrk();
  K=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
  const normAns=String(sqAns||'').trim().toLowerCase();
  a[u]={
    email:email||'',
    it:IT,
    p:await wr(K,p,IT),
    r:await wr(K,rk,IT),
    sqIdx:sqIdx,
    s:await wr(K,normAns,IT),
    iv:'',
    ct:'',
    created:Date.now()
  };
  pA(a);UN=u;st.guest=0;
  await pst();
  try{localStorage.removeItem('mdr')}catch(e){}
  return rk;
}

async function lg(loginId,p){
  const found=findUser(loginId);
  if(!found){
    await dk(p,rnd(16),IT);
    throw new Error('Akun tidak ditemukan');
  }
  const u=found.username,r=found.acc;
  K=await uw(r.p,p,r.it);
  UN=u;st.guest=0;
  if(r.ct&&r.iv){
    const t=await crypto.subtle.decrypt({name:'AES-GCM',iv:u6(r.iv),additionalData:E.encode(u)},K,u6(r.ct));
    st=Object.assign({},D0,JSON.parse(Dc.decode(t)));
  }
}

async function resetPassWithSQ(loginId,ans,newPass){
  const found=findUser(loginId);
  if(!found)throw new Error('Akun tidak ditemukan');
  const u=found.username,r=found.acc;
  if(!r.s)throw new Error('Akun ini belum memiliki pertanyaan keamanan. Silakan gunakan kunci pemulihan.');
  const normAns=String(ans||'').trim().toLowerCase();
  const recoveredKey=await uw(r.s,normAns,r.it);
  r.p=await wr(recoveredKey,newPass,r.it);
  const a=gA();a[u]=r;pA(a);
  return true;
}

async function resetPassWithRK(loginId,rk,newPass){
  const found=findUser(loginId);
  if(!found)throw new Error('Akun tidak ditemukan');
  const u=found.username,r=found.acc;
  const cleanRk=rk.replace(/[\s-]/g,'').toUpperCase();
  const recoveredKey=await uw(r.r,cleanRk,r.it);
  const newRk=nrk();
  r.p=await wr(recoveredKey,newPass,r.it);
  r.r=await wr(recoveredKey,newRk,r.it);
  const a=gA();a[u]=r;pA(a);
  return newRk;
}

async function changePassword(currentPass,newPass){
  if(st.guest)throw new Error('Mode tamu tidak memiliki password. Silakan buat akun.');
  const a=gA(),r=a[UN];
  if(!r)throw new Error('Data akun tidak ditemukan');
  const recoveredKey=await uw(r.p,currentPass,r.it);
  r.p=await wr(recoveredKey,newPass,r.it);
  a[UN]=r;pA(a);
  return true;
}

function pw(p,u){let c=0;[/[a-z]/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/].forEach(r=>{if(r.test(p))c++});const l=p.toLowerCase(),bad=CM.some(x=>l.includes(x))||(u&&l.includes(u))||/(.)\1{3,}/.test(p);return{ok:p.length>=8&&c>=2&&!bad,s:bad?0:Math.min(4,Math.floor(p.length/4)+c-1),bad}}

  const w=Math.ceil(lk());

  if(mode==='login'){

      enter();
    }catch(e){
      fl(1);

      btn.disabled=false;btn.textContent='Masuk';
    }
  }
  else if(mode==='reg'){

    if(!/^[a-z0-9_]{3,20}$/.test(u))return showAuthAlert('Username 3–20 karakter (huruf kecil, angka, atau garis bawah).','err');
    if(findUser(u))return showAuthAlert('Username sudah digunakan. Silakan gunakan nama lain.','err');
    if(email&&findUser(email))return showAuthAlert('Email sudah digunakan di perangkat ini.','err');
    const q=pw(p,u);
    if(!q.ok)return showAuthAlert('Password minimal 8 karakter dengan kombinasi huruf dan angka.','err');
    if(p!==p2)return showAuthAlert('Konfirmasi password tidak cocok.','err');
    if(!ans)return showAuthAlert('Harap isi jawaban pertanyaan keamanan untuk perlindungan akun.','err');

    btn.disabled=true;btn.textContent='Mengenkripsi & membuat akun...';
    try{
      const rk=await reg(u,email,p,sqIdx,ans);
      fl(0);
      rkv(rk);
    }catch(e){
      showAuthAlert('Gagal membuat akun: '+(e.message||'Terjadi kesalahan.'),'err');
      btn.disabled=false;btn.textContent='Daftar & Buat Kunci Keamanan';
    }
  }
  else if(mode==='forgot'){
    if(fgtStep==='id'){
      const id=($('#fgt_id')||{}).value.trim();
      if(!id)return showAuthAlert('Masukkan username atau email Anda.','err');
      const found=findUser(id);
      if(!found)return showAuthAlert('Akun tidak ditemukan. Periksa kembali username/email Anda.','err');
      fgtUser=found.username;
      av('forgot',found.acc.s?'sq':'rk');
    }
    else if(fgtStep==='sq'){
      const ans=($('#fgt_ans')||{}).value.trim();
      const newP=($('#fgt_new_p')||{}).value,newP2=($('#fgt_new_p2')||{}).value;
      if(!ans)return showAuthAlert('Ketikkan jawaban pertanyaan keamanan.','err');
      if(newP.length<8)return showAuthAlert('Password baru minimal 8 karakter.','err');
      if(newP!==newP2)return showAuthAlert('Konfirmasi password baru tidak cocok.','err');

      btn.disabled=true;btn.textContent='Memverifikasi jawaban...';
      try{
        await resetPassWithSQ(fgtUser,ans,newP);
        fl(0);
        await lg(fgtUser,newP);
        tt('Password berhasil diperbarui!');
        enter();
      }catch(e){
        fl(1);
        showAuthAlert('Jawaban pertanyaan keamanan salah. Coba lagi atau gunakan kunci pemulihan.','err');
        btn.disabled=false;btn.textContent='Simpan Password Baru & Masuk';
      }
    }
    else if(fgtStep==='rk'){
      const rk=($('#fgt_rk')||{}).value.trim();
      const newP=($('#fgt_new_p')||{}).value,newP2=($('#fgt_new_p2')||{}).value;
      if(!rk)return showAuthAlert('Masukkan kunci pemulihan 20 karakter.','err');
      if(newP.length<8)return showAuthAlert('Password baru minimal 8 karakter.','err');
      if(newP!==newP2)return showAuthAlert('Konfirmasi password baru tidak cocok.','err');

      btn.disabled=true;btn.textContent='Membuka enkripsi kunci...';
      try{
        await resetPassWithRK(fgtUser,rk,newP);
        fl(0);
        await lg(fgtUser,newP);
        tt('Password berhasil direset dengan kunci pemulihan!');
        enter();
      }catch(e){
        fl(1);
        showAuthAlert('Kunci pemulihan tidak valid. Periksa kembali 20 karakter kunci Anda.','err');
        btn.disabled=false;btn.textContent='Reset Password dengan Kunci';
      }
    }
  }
}

function inst(){ip?ip.prompt():tt('Gunakan menu browser: Tambahkan ke layar utama')}
setInterval(()=>{if(st.rem&&window.Notification&&Notification.permission=='granted'){const d=new Date(),h=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');if(h==st.rem&&st.rl!=dn()+h){st.rl=dn()+h;sv();new Notification(st.lang=='en'?'Time to learn Mandarin! 学':'Waktunya belajar Mandarin! 学')}}},20000);
document.body.classList.toggle('nopy',!!st.nopy);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
