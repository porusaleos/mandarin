['Kalimat 把 dan 被',3,'Subjek|把|Objek|Kata kerja|Hasil  ·  Objek|被|Pelaku|Kata kerja','把: subjek MEMPERLAKUKAN objek dan ada hasil sesudahnya. 被: objek mengalami sesuatu (pasif), pelakunya boleh disebut. Kata kerjanya tidak boleh berdiri sendiri; harus ada hasil atau 了.',['我 把 作业 做 完 了|Wǒ bǎ zuòyè zuò wán le|Saya sudah menyelesaikan tugas','请 把 门 关上|Qǐng bǎ mén guānshàng|Tolong tutup pintunya','我 的 手机 被 弟弟 借 走 了|Wǒ de shǒujī bèi dìdi jiè zǒu le|Ponselku dipinjam adikku']],
['Kalimat majemuk berpasangan',2,'因为|所以  ·  虽然|但是  ·  如果|就','Di Mandarin kedua kata penghubung dipakai bersamaan, tidak boleh salah satu saja seperti kebiasaan bahasa Indonesia ("karena… maka…").',['因为 下雨 所以 我 没 去|Yīnwèi xiàyǔ suǒyǐ wǒ méi qù|Karena hujan, saya tidak pergi','虽然 很 累 但是 我 很 高兴|Suīrán hěn lèi dànshì wǒ hěn gāoxìng|Meski capek, saya senang','如果 你 有 时间 就 来 吧|Rúguǒ nǐ yǒu shíjiān jiù lái ba|Kalau ada waktu, datanglah']]
