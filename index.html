function mk(w,ok){st.m[w.h]=Math.max(0,(st.m[w.h]||0)+(ok?1:-1));sv()}
function go(t){tab=t;cur=null;draw()}
function tg(k){const i=st.lv.indexOf(k);i>=0?st.lv.splice(i,1):st.lv.push(k);if(!st.lv.length)st.lv=[k];sv();cur=null;draw()}
function draw(){

$('#lv').style.display=tab=='path'||(cur&&cur.k=='lesson')?'none':'';({path,home,cards,drill,vocab,pat})[tab]()}
function home(){const d=W[Math.floor(Date.now()/864e5)%W.length],h=Object.keys(L).map(k=>{const a=W.filter(w=>w.v==k),n=a.filter(w=>(st.m[w.h]||0)>=3).length;return`<div class="row"><span>${L[k]}</span><div class="bar"><i style="width:${n/a.length*100}%"></i></div><small>${n}/${a.length}</small></div>`}).join('');
app.innerHTML=`<section class="card hero"><div class="zh">${d.h}</div><div><p class="mu">Kata hari ini</p><h2>${d.p}</h2><p>${d.m}</p><button class="btn" onclick="say('${d.h}')">🔊 Dengar</button></div></section>
<div class="stats"><div class="card"><b>${st.streak}</b><small>hari beruntun</small></div><div class="card"><b>${st.xp}</b><small>XP, ${rk(st.xp)}</small></div><div class="card"><b>${Object.values(st.m).filter(x=>x>=3).length}</b><small>kata hafal</small></div></div>
<section class="card"><h3>Progres per level</h3>${h}<p class="mu">Kata dianggap hafal setelah dijawab benar 3 kali. Progres tersimpan di browser ini.</p></section>
<button class="btn" onclick="go('pat')">Lihat pola kalimat</button>`}
function cards(){if(!cur||cur.k!='c')cur={k:'c',q:sh(pool()).sort((a,b)=>(st.m[a.h]||0)-(st.m[b.h]||0)).slice(0,15),i:0,f:0};const c=cur;

const w=c.q[c.i];app.innerHTML=`<p class="mu">Kartu ${c.i+1} dari ${c.q.length}</p><section class="card fc" onclick="cur.f=1;say('${w.h}');cards()"><div class="zh big">${w.h}</div><h2 class="py">${w.p}</h2>${c.f?`<p class="big2">${w.m}</p>`:'<p class="mu">Ketuk kartu untuk melihat arti</p>'}</section><div class="acts"><button class="btn" onclick="say('${w.h}')">🔊 Dengar</button>${c.f?`<button class="btn bad" onclick="nx(0)">✗ Ulangi</button><button class="btn ok" onclick="nx(1)">✓ Hafal</button>`:''}</div>`}
function nx(ok){const c=cur,w=c.q[c.i];mk(w,ok);gain(ok?2:1);if(!ok)c.q.push(w);c.i++;c.f=0;cards()}
function drill(){if(cur&&cur.run){cur.run();return}
app.innerHTML=`<div class="grid">${[['quiz','Kuis pilihan ganda','Hanzi, pinyin, dan arti'],['match','Pasangkan','Cocokkan hanzi dengan pinyin atau arti'],['type','Ketik pinyin','Tulis pinyin dari hanzi'],['blitz','Blitz 60 detik','Jawab secepat mungkin dan kejar kombo'],['ear','Dengar dan pilih','Dengarkan, lalu pilih artinya'],['ord','Susun kalimat','Urutkan kata menjadi kalimat']].map(([k,a,b])=>`<button class="card mode" onclick="start('${k}')"><b>${a}</b><span>${b}</span></button>`).join('')}</div>`}
const D=[['h','m','Apa arti kata ini?'],['m','h','Pilih hanzi untuk arti ini:'],['h','p','Pilih pinyin yang tepat:'],['p','m','Apa arti pinyin ini?']];
const mq=()=>{const w=sh(pool())[0];return{w,d:D[R(4)],o:sh([w,...sh(pool().filter(x=>x!=w)).slice(0,3)])}},rk=x=>x<50?'Pemula':x<200?'Pelajar':x<500?'Mahir':'Suhu';
function start(k){const f=S.filter(s=>st.lv.includes(s.v));cur={k,sc:0,i:0,r:0,cb:0,q:[],t:60,run:()=>({quiz:qz,ear:qz,blitz:qz,match:mt,type:ty,ord:od})[k]()};if(k=='blitz'){const c=cur,t=setInterval(()=>{if(cur!==c)return clearInterval(t);c.t--;const e=$('#tm');if(e)e.textContent='⏱ '+c.t+' dtk';if(c.t<=0){clearInterval(t);c.over=1;fin(c.sc,c.i)}},1000)}
if(k=='quiz'||k=='ear')cur.q=sh(pool()).slice(0,10).map(w=>({w,d:k=='ear'?['h','m','Dengarkan, lalu pilih artinya:']:D[R(4)],o:sh([w,...sh(pool().filter(x=>x!=w)).slice(0,3)])}));
if(k=='type')cur.q=sh(pool()).slice(0,8);
if(k=='ord')cur.q=sh(f.length?f:S).slice(0,6);
cur.run()}
function fin(sc,n){if(cur&&cur.k=='lesson')return ld();gain(sc*3);app.innerHTML=`<section class="card ctr"><h2>${sc} dari ${n}</h2><p>${sc==n?'Sempurna!':sc>=n*.7?'Bagus, lanjutkan.':'Ulangi supaya makin hafal.'}</p><p class="mu">+${Math.round(sc*3)} XP</p><div class="acts"><button class="btn" onclick="start(cur.k)">Main lagi</button><button class="btn" onclick="cur=null;draw()">Menu latihan</button></div></section>`}
function qz(){const c=cur;if(c.k=='lesson'&&c.h<1)return lf();if(c.k=='blitz'){if(c.over)return fin(c.sc,c.i);if(!c.q[c.i])c.q.push(mq())}if(c.i>=c.q.length)return fin(c.sc,c.q.length);const{w,d,o}=c.q[c.i];
app.innerHTML=`${c.k=='blitz'?`<p class="mu"><span id="tm">⏱ ${c.t} dtk</span> 🔥 kombo x${c.cb}, skor ${c.sc}</p>`:c.k=='lesson'?hd(c):`<p class="mu">Soal ${c.i+1} dari ${c.q.length}</p>`}<section class="card ctr"><p>${d[2]}</p>${c.k=='ear'||d[3]?`<button class="btn" onclick="say('${w.h}')">🔊 Putar</button>`:`<div class="${d[0]=='h'?'zh big':'big2'}" onclick="say('${w.h}')">${w[d[0]]}</div>${d[0]=='h'&&d[1]!='p'?`<h2 class="py">${w.p}</h2>`:''}`}</section><div class="opts">${o.map((x,j)=>`<button class="btn opt ${d[1]=='h'?'zh':''}" onclick="ans(${j})">${d[1]=='h'?`<span class="big3">${x.h}</span><br><small>${x.p}</small>`:x[d[1]]}</button>`).join('')}</div><div id="fb"></div>`;if(c.k=='ear'||d[3]||d[0]=='h')say(w.h)}
function ans(j){const c=cur,{w,d,o}=c.q[c.i],ok=o[j]==w;mk(w,ok);c.cb=ok?(c.cb||0)+1:0;if(ok){c.sc++;if(c.cb>2)gain(c.cb>5?2:1)}say(o[j].h);if(c.k=='lesson'&&!ok){c.h--;c.q.push(c.q[c.i])}
document.querySelectorAll('.opt').forEach((b,x)=>{b.disabled=1;if(o[x]==w)b.classList.add('ok');else if(x==j)b.classList.add('bad')});
$('#fb').innerHTML=`<p class="${ok?'fo':'fx'}">${ok?'✓ Benar'+(c.cb>2?' 🔥 kombo x'+c.cb:''):'✗ Kurang tepat'}</p><p class="mu"><span class="zh">${w.h}</span> ${w.p}: ${w.m}</p><button class="btn" onclick="cur.i++;cur.run()">Lanjut</button>`;if(c.k=='blitz'&&ok)setTimeout(()=>{if(cur===c&&!c.over){c.i++;c.run()}},700)}
function mt(){const c=cur;if(c.r==3)return fin(c.sc,15);
if(!c.a){c.a=sh(pool()).slice(0,5);c.t=R(2)?'p':'m';c.L=sh(c.a);c.Q=sh(c.a);c.d=[];c.s=null}
const b=(w,s)=>`<button class="btn opt ${c.d.includes(w)?'ok':''} ${c.s==w&&s=='l'?'sel':''}" ${c.d.includes(w)?'disabled':''} onclick="pk('${s}',${c.a.indexOf(w)})">${s=='l'?`<span class="zh big3">${w.h}</span>${c.t=='m'?`<br><small>${w.p}</small>`:''}`:w[c.t]}</button>`;
app.innerHTML=`<p class="mu">Ronde ${c.r+1} dari 3</p><p>Cocokkan hanzi dengan ${c.t=='p'?'pinyin':'arti'}nya: ketuk hanzi, lalu pasangannya.</p><div class="two"><div>${c.L.map(w=>b(w,'l')).join('')}</div><div>${c.Q.map(w=>b(w,'r')).join('')}</div></div><div id="fb"></div>`}
function pk(s,i){const c=cur,w=c.a[i];say(w.h);if(s=='l'){c.s=w;mt();return}if(!c.s)return;const ok=c.s==w;
if(ok){c.d.push(w);c.sc++;mk(w,1)}else mk(c.s,0);c.s=null;if(c.d.length==5){c.r++;c.a=0}mt();if(!ok&&c.a)$('#fb').innerHTML='<p class="fx">✗ Belum cocok, coba lagi</p>'}
function ty(){const c=cur;if(c.i>=c.q.length)return fin(c.sc,c.q.length);const w=c.q[c.i];c.chk=0;
app.innerHTML=`<p class="mu">Soal ${c.i+1} dari ${c.q.length}</p><section class="card ctr"><div class="zh big">${w.h}</div><p>${w.m}</p><button class="btn" onclick="say('${w.h}')">🔊 Dengar</button></section><input id="inp" class="inp" placeholder="Ketik pinyin (nada boleh dilewati)" autocomplete="off" autocapitalize="off" aria-label="Jawaban pinyin"><div class="acts"><button class="btn" onclick="ck()">Periksa</button><button class="btn" onclick="$('#fb').innerHTML='<p class=mu>Petunjuk: huruf pertama '+nt(cur.q[cur.i].p)[0]+', jumlah huruf '+nt(cur.q[cur.i].p).length+'</p>'">💡 Petunjuk</button></div><div id="fb"></div>`;
$('#inp').onkeydown=e=>{if(e.key=='Enter')ck()};$('#inp').focus();say(w.h)}
function ck(){const c=cur;if(c.chk)return;c.chk=1;const w=c.q[c.i],v=$('#inp').value.replace(/v/gi,'ü'),z=s=>s.replace(/\s/g,'').toLowerCase(),ex=z(v)==z(w.p),ok=ex||nt(v)==nt(w.p);
mk(w,ok);if(ok)c.sc+=ex?1:.5;$('#inp').disabled=1;
$('#fb').innerHTML=`<p class="${ok?'fo':'fx'}">${ex?'✓ Sempurna':ok?'✓ Hampir benar, nada belum tepat':'✗ Belum tepat'}</p><p>Jawaban: <b>${w.p}</b></p><button class="btn" onclick="cur.i++;cur.run()">Lanjut</button>`}
function od(){const c=cur;if(c.i>=c.q.length)return fin(c.sc,c.q.length);const s=c.q[c.i];
if(!c.w){const py=s.p.split(' ');c.w=sh(s.t.split(' ').map((x,i)=>({x,i,p:py[i]||''})));c.a=[];c.chk=0}
const ch=(o,k)=>`<button class="chip big3 zh" onclick="mv('${k}',${o.i})">${o.x}<br><small>${o.p}</small></button>`;
app.innerHTML=`<p class="mu">Soal ${c.i+1} dari ${c.q.length}</p><section class="card ctr"><p>${s.m}</p></section><div class="tray">${c.a.map(o=>ch(o,'a')).join('')||'<span class="mu">Ketuk kata di bawah untuk menyusun</span>'}</div><div class="tray">${c.w.map(o=>ch(o,'w')).join('')}</div><button class="btn" onclick="cko()">Periksa</button><div id="fb"></div>`}
function mv(k,i){const c=cur;if(c.chk)return;say([...c.w,...c.a].find(o=>o.i==i).x);const f=k=='w'?c.w:c.a,t=k=='w'?c.a:c.w;t.push(...f.splice(f.findIndex(o=>o.i==i),1));od()}
function cko(){const c=cur;if(c.chk)return;const s=c.q[c.i],ok=c.a.map(o=>o.x).join(' ')==s.t;if(!c.a.length)return;c.chk=1;if(ok)c.sc++;gain(ok?1:0);
$('#fb').innerHTML=`<p class="${ok?'fo':'fx'}">${ok?'✓ Benar':'✗ Urutan yang benar:'}</p><p class="zh big3">${s.t.replace(/ /g,'')}</p><p class="mu">${s.p}</p><div class="acts"><button class="btn" onclick="say('${s.t.replace(/ /g,'')}')">🔊 Dengar</button><button class="btn" onclick="cur.i++;cur.w=0;cur.run()">Lanjut</button></div>`}
function vocab(){app.innerHTML=`<input id="q" class="inp" placeholder="Cari hanzi, pinyin, atau arti" oninput="vl()" aria-label="Cari kosakata"><div id="vl"></div>`;vl()}
function vl(){const q=$('#q').value.toLowerCase();$('#vl').innerHTML=W.filter(w=>st.lv.includes(w.v)&&(w.h+w.p+nt(w.p)+w.m).toLowerCase().includes(q)).map(w=>`<div class="card vr"><span class="zh vh">${w.h}</span><div><b>${w.p}</b><br><span class="mu">${w.m}</span></div><small>${L[w.v]}</small><button class="ic" onclick="say('${w.h}')" aria-label="Dengar ${w.h}">🔊</button></div>`).join('')||'<p class="mu">Tidak ada kata yang cocok. Coba aktifkan level lain di atas.</p>'}
function pat(){app.innerHTML=P.map(p=>{const[a,b,h,y,m]=p.split('|');return`<div class="card"><h3>${a}</h3><p class="mu">${b}</p><p class="zh big3">${h} <button class="ic" onclick="say('${h}')" aria-label="Dengar">🔊</button></p><p><b>${y}</b></p><p>${m}</p></div>`}).join('')}
const LS=[];[1,2,3,4,5].forEach(v=>{const a=W.filter(w=>w.v==v);for(let i=0;i<a.length;i+=5)LS.push({v,w:a.slice(i,i+5)})});
const hd=c=>`<div class="lh"><div class="bar"><i style="width:${c.i/c.q.length*100}%"></i></div><b>❤️ ${c.h}</b></div>`;
function path(){const n=LS.findIndex((_,i)=>!st.done[i]),nx=n<0?LS.length:n;
app.innerHTML=`<div class="card"><b>🔥 ${st.streak}</b> hari beruntun, <b>⭐ ${st.xp}</b> XP</div>`+[1,2,3,4,5].map(v=>`<section class="unit u${v}"><h3>${v==5?'Unit Komputer':'Unit HSK '+v}</h3><small>${LS.filter(l=>l.v==v).length} pelajaran, 5 kata per pelajaran</small></section><div class="nodes">${LS.map((l,i)=>[l,i]).filter(([l])=>l.v==v).map(([l,i],j)=>{const d=st.done[i],k=i>nx;return`<button class="node ${d?'dn':k?'lk':''}" ${k?'disabled':''} style="margin-left:${[0,50,76,50,0,-50,-76,-50][j%8]}px" onclick="lesson(${i})"><span class="zh">${l.w[0].h}</span><small>${d?'⭐'.repeat(d):k?'🔒':l.w[0].p}</small></button>`}).join('')}</div>`).join('')}
function lesson(i){const l=LS[i],q=[],m2=(w,d)=>({w,d,o:sh([w,...sh(W.filter(x=>x!=w)).slice(0,3)])});
l.w.forEach(w=>q.push({t:'L',w}));sh(l.w).forEach(w=>q.push(m2(w,['h','m','Dengarkan, lalu pilih artinya:',1])));sh(l.w).forEach(w=>q.push(m2(w,D[R(4)])));
cur={k:'lesson',li:i,q,i:0,sc:0,h:3,cb:0,run:()=>{const s=cur.q[cur.i];s&&s.t=='L'?lr(s):qz()}};tab='drill';draw()}
function lr(s){const c=cur,w=s.w;app.innerHTML=`${hd(c)}<section class="card ctr"><p class="mu">Kata baru, ketuk untuk mendengar</p><div class="zh big" onclick="say('${w.h}')">${w.h}</div><h2 class="py">${w.p}</h2><p class="big2">${w.m}</p><button class="btn" onclick="say('${w.h}')">🔊 Dengar lagi</button></section><button class="btn go" onclick="cur.i++;cur.run()">Lanjut</button>`;say(w.h)}
function ld(){const c=cur,s=Math.max(1,c.h);st.done[c.li]=Math.max(st.done[c.li]||0,s);gain(10+s*3);app.innerHTML=`<section class="card ctr"><div class="big">🎉</div><h2>Pelajaran selesai!</h2><p>${'⭐'.repeat(s)}</p><p class="mu">+${10+s*3} XP</p><button class="btn go" onclick="go('path')">Lanjut belajar</button><button class="btn" onclick="lesson(${c.li})">Ulangi pelajaran</button></section>`}
function lf(){app.innerHTML=`<section class="card ctr"><div class="big">💔</div><h2>Nyawa habis</h2><p>Tenang, ulangi pelajarannya supaya makin hafal.</p><button class="btn go" onclick="lesson(${cur.li})">Coba lagi</button><button class="btn" onclick="go('path')">Kembali</button></section>`}
draw();
</script></body></html>
